name: Sync Submodules

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodules to latest main
        run: |
          git submodule update --remote
          git -C wavCSE/wavCSE checkout main
          git -C LibMTL/LibMTL checkout main

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No submodule updates found."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Sync submodules to latest upstream main"
          title: "chore: sync submodules to latest upstream"
          body: "Submodule updates detected. Auto-generated by the sync-submodules workflow."
          branch: "sync/submodules"
          base: "main"
          delete-branch: true
